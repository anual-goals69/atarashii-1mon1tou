<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜新しい一問一答 —世界をつなぐ、過去と現在をつなぐ—</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#faf6ee; --fg:#33302a; --sub:#6f695e;
    --card:#ffffff; --amber:#e8a020; --amber-deep:#8f5e0e;
    --teal:#1f756d; --coral:#c2413a;
    --line:#eadfc8; --shadow:0 2px 10px rgba(120,95,40,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181511; --fg:#efe9df; --sub:#b0a898;
      --card:#221e18; --amber:#e8a020; --amber-deep:#f0b23c;
      --teal:#4db8ae; --coral:#e8776f;
      --line:#3a332a; --shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background:var(--bg); color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1.85;
  }
  .topbar{height:6px; background:linear-gradient(90deg, var(--coral), var(--amber), var(--teal));}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:2em 1.2em;}
  .card{
    max-width:480px; text-align:center; background:var(--card); padding:2.2em 1.8em;
    border-radius:16px; border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .num{font-size:2.6em; font-weight:800; color:var(--amber-deep); letter-spacing:.08em;}
  h1{font-size:1.05em; font-weight:800; margin:.4em 0 .8em;}
  p{color:var(--sub); font-size:.9em; margin:.4em 0;}
  a.btn{
    display:inline-block; margin-top:1.2em; padding:.7em 1.6em;
    background:var(--amber); color:#2b2214; text-decoration:none; font-weight:800;
    border-radius:999px; font-size:.95em; letter-spacing:.06em;
    box-shadow:0 3px 0 var(--amber-deep); transition:transform .08s;
  }
  a.btn:hover{transform:translateY(2px); box-shadow:0 1px 0 var(--amber-deep);}
</style>
<!--lowstrain-->
<style>
  /* 低負荷UI一括適用（apply_low_strain.py）。文字サイズは判読性・眼精疲労の最重要因子 */
  html{font-size:106.25%;}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }
  :where(a, button, summary, [tabindex]):focus-visible{
    outline:2px solid var(--gold, var(--amber-deep, #75610a)); outline-offset:2px; border-radius:2px;
  }
</style>
<!--/lowstrain-->
</head>
<body>
<div class="topbar"></div>
<main>
  <div class="card">
    <div class="num">404</div>
    <h1>ページが見つかりませんでした</h1>
    <p>お探しのページは、公開前か、移動または削除された可能性があります。</p>
    <p>お手数をおかけしますが、ホームからお探しいただけますと幸いです。</p>
    <a class="btn" href="/">ホームへ戻る</a>
  </div>
</main>
</body>
</html>
